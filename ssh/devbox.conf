# Managed by ~/.dotfiles (ssh/devbox.conf). Edit it there.
# HostName is the Tailscale MagicDNS short name, so the tailnet ID stays out of
# this public repo. It needs MagicDNS with the tailnet search domain enabled.

Host devbox
  # Debian requires a full locale name for the value sent by macOS.
  SetEnv LC_CTYPE=en_US.UTF-8
  HostName devbox
  HostKeyAlias 192.168.1.73
  User bjardon
  IdentityFile ~/.ssh/id_ed25519
  IdentitiesOnly yes
  AddKeysToAgent yes
  UseKeychain yes
  ServerAliveInterval 30
  ServerAliveCountMax 3

Host oxpbox
  # Debian requires a full locale name for the value sent by macOS.
  SetEnv LC_CTYPE=en_US.UTF-8
  HostName devbox
  HostKeyAlias 192.168.1.73
  User oxperience
  IdentityFile ~/.ssh/id_ed25519
  IdentitiesOnly yes
  AddKeysToAgent yes
  UseKeychain yes
  ServerAliveInterval 30
  ServerAliveCountMax 3
